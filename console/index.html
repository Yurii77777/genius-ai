<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>genius-ai console</title>
<style>
  :root { --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  html, body { margin: 0; height: 100%; background: #000; }
  body { font-family: var(--mono); color: #cfe4ff; -webkit-font-smoothing: antialiased; }
  body[data-skin="hunter"] { overflow: hidden; user-select: none; cursor: default; }
  body[data-skin="classic"] { background: #131518; }
  #hunter, #classic { display: none; }
  body[data-skin="hunter"] #hunter { display: block; }
  body[data-skin="classic"] #classic { display: block; }
  canvas#field { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: crosshair; }
  /* the real text field is invisible: the console draws the line itself */
  #cmd { position: fixed; opacity: 0; pointer-events: none; border: 0; padding: 0; margin: 0; font-size: 16px;
    background: transparent; color: transparent; caret-color: transparent; outline: none; }
  /* HUD text: one acid phosphor green for every small utility label, with a faint glow and a dark backing */
  :root { --hud: #66ff33; --hud-dim: #4fd12a; --hud-glow: 0 0 6px rgba(102, 255, 51, .45); --hud-edge: 0 0 1px #000, 0 0 2px #000; }
  .hud { font-size: 12px; line-height: 17px; letter-spacing: .1em; color: var(--hud); white-space: nowrap;
    text-shadow: var(--hud-edge), var(--hud-glow); background: rgba(0, 4, 0, .92); padding: 3px 8px 2px; border-radius: 2px; }
  #sys { position: fixed; left: 30px; top: 8px; pointer-events: none; max-width: calc(100vw - 260px); overflow: hidden; text-overflow: ellipsis; }
  #keys { position: fixed; left: 30px; bottom: 62px; text-align: left; white-space: normal; max-width: calc(23vw - 64px); pointer-events: none; transition: color .2s; }
  #keys b { color: #e8ff3a; font-weight: 700; }
  #keys.warn { color: #ff6a50; }
  #dev { position: fixed; left: 30px; bottom: 34px; pointer-events: none; }
  #perf { white-space: nowrap; color: var(--hud); }
  #dry { position: fixed; right: 30px; bottom: 36px; pointer-events: none; border: 1px solid rgba(255, 106, 80, .6); color: #ff6a50; }
  /* skin switch: small, top right, same in both skins */
  #skin { position: fixed; right: 30px; top: 8px; z-index: 20; display: flex; gap: 0; font: 11px/16px var(--mono); letter-spacing: .08em; }
  #skin button { font: inherit; letter-spacing: inherit; cursor: pointer; border: 1px solid rgba(102, 255, 51, .45); background: rgba(0, 4, 0, .92);
    color: var(--hud); padding: 2px 8px; margin: 0; }
  #skin button + button { border-left: 0; }
  #skin button.on { background: var(--hud); color: #031000; }
  body[data-skin="classic"] #skin button { border-color: #2c2e31; background: #17191d; color: #98999b; font-family: -apple-system, system-ui, sans-serif; letter-spacing: 0; }
  body[data-skin="classic"] #skin button.on { background: #2c2e31; color: #eeeeef; }
  #link { position: fixed; left: 50%; top: 8px; transform: translateX(-50%); z-index: 30; }
  #link:not([hidden]) { font: 12px/17px var(--mono); color: #ff6a50; background: #100; border: 1px solid #ff6a50; padding: 3px 10px; }
  /* the conversation with the coordinator, over the open channel: real text, readable, scrollable */
  #conv { position: fixed; z-index: 5; overflow-y: auto; overscroll-behavior: contain; user-select: text; cursor: auto;
    font: 15px/1.5 var(--mono); color: #eef2ff; padding: 4px 10px 10px 2px; scrollbar-width: thin; scrollbar-color: #4a3d8a transparent; }
  #conv::-webkit-scrollbar { width: 6px; } #conv::-webkit-scrollbar-thumb { background: #4a3d8a; border-radius: 3px; }
  #conv .c-who { display: block; font-size: 11px; letter-spacing: .12em; color: var(--hud); margin-bottom: 4px; }
  #conv .c-ask { color: #b7b0d8; border-left: 2px solid #4a3d8a; padding: 2px 0 2px 10px; margin: 2px 0 12px; cursor: pointer; }
  #conv .c-ask-t { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; white-space: normal; overflow-wrap: anywhere; }
  #conv .c-ask.full .c-ask-t { display: block; white-space: pre-wrap; }
  #conv .c-ask .c-who { color: #9a8fd0; }
  #conv .c-rep .c-who { color: #ffb238; }
  #conv .md .p, #conv .md .li, #conv .md .q, #conv .md .h { margin: 0 0 2px; }
  #conv .md .h { font-weight: 700; color: #fff; margin-top: 6px; }
  #conv .md .gap { height: 8px; }
  #conv .md .li { position: relative; } #conv .md .bul { position: absolute; margin-left: -1.2em; color: #ffb238; }
  #conv .md .q { color: #b7b0d8; border-left: 2px solid #333; padding-left: 8px; }
  #conv .md b { color: #fff; } #conv .md u { text-decoration-color: #666; }
  #conv code, #conv pre { font-family: var(--mono); background: rgba(255, 255, 255, .07); border-radius: 3px; }
  #conv code { padding: 0 4px; } #conv pre { padding: 6px 8px; margin: 4px 0 8px; white-space: pre-wrap; font-size: 13.5px; }
  #conv table { border-collapse: collapse; margin: 4px 0 8px; font-size: 14px; }
  #conv th, #conv td { text-align: left; vertical-align: top; padding: 2px 14px 2px 0; border-bottom: 1px solid rgba(255, 255, 255, .08); }
  #conv th { color: #ffb238; font-weight: 600; }
  #conv .c-spoken { margin-top: 12px; padding: 8px 12px; border: 1px solid rgba(102, 255, 51, .45); border-radius: 3px;
    color: var(--hud); background: rgba(0, 20, 0, .55); text-shadow: var(--hud-glow); }
  #conv .c-think .c-who { color: #c79bff; }
  #conv .c-think .c-who::after { content: ''; display: inline-block; width: 7px; height: 7px; margin-left: 8px; border-radius: 50%;
    background: #c79bff; box-shadow: 0 0 8px #c79bff; animation: pulse 1s ease-in-out infinite; vertical-align: 1px; }
  #conv .c-stream { font-size: 13px; letter-spacing: .18em; color: rgba(199, 155, 255, .55); white-space: nowrap; overflow: hidden; margin: 6px 0 8px; }
  #conv .c-doing { color: #eef2ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #conv .c-empty { color: #8a84a8; padding-top: 8px; }
  #teaser { position: fixed; z-index: 6; transform: translateX(-50%); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font: 14px/20px var(--mono); color: #eef2ff; background: rgba(8, 4, 20, .9); border: 1px solid rgba(255, 178, 56, .55); padding: 4px 12px; border-radius: 3px; }
  #teaser .dot, #unread { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ffb238; box-shadow: 0 0 8px #ffb238; animation: pulse 1.4s ease-in-out infinite; }
  #teaser .dot { margin-right: 9px; vertical-align: 1px; }
  #unread { position: fixed; z-index: 6; width: 11px; height: 11px; pointer-events: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
  @media (max-width: 640px) { #sys, #keys, #dev { display: none; } #skin { right: 16px; } }
</style>
<link rel="stylesheet" href="./classic.css">
</head>
<body data-skin="">
<div id="skin" title="K: switch skin"><button data-skin="hunter">HUNTER</button><button data-skin="classic">CLASSIC</button></div>
<div id="link" hidden></div>
<div id="hunter">
  <canvas id="field"></canvas>
  <div id="sys" class="hud">--:--</div>
  <div id="keys" class="hud"></div>
  <input id="cmd" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Message to the coordinator">
  <div id="dev" class="hud"><div id="perf">-- fps</div></div>
  <div id="conv" hidden></div>
  <div id="teaser" hidden></div>
  <div id="unread" hidden></div>
  <div id="dry" class="hud" hidden>DRY-RUN · ACTIONS ARE LOGGED, NOT RUN</div>
</div>
<div id="classic"></div>
<script>
// three.js 0.170.0: the vendored copy (works offline); the pinned CDN copy only when this bridge does
// not serve console/vendor/ yet (a bridge started before the file was added)
(function () {
  let src = 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
  try { const x = new XMLHttpRequest(); x.open('HEAD', './vendor/three.module.js', false); x.send(); if (x.status === 200) src = './vendor/three.module.js'; } catch (e) { /* CDN */ }
  const m = document.createElement('script'); m.type = 'importmap';
  m.textContent = JSON.stringify({ imports: { three: src } });
  document.currentScript.after(m);
})();
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
